<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyas Associates</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2433; --accent:#d9480f; --muted:#667085; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:24px 20px; }
  header h1 { margin:0 0 4px; font-size:1.5rem; }
  header p { margin:0; color:#c5cad6; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h2 { margin:28px 0 12px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; }
  input, select, button { padding:10px 12px; font-size:1rem; border:1px solid #cfd4dc; border-radius:8px; }
  input { flex:1; min-width:200px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.secondary { background:#e4e7ec; color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:14px; }
  .card { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; }
  .tag { display:inline-block; font-size:.75rem; background:#fde8dc; color:var(--accent); padding:2px 8px; border-radius:99px; margin-right:4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .card button { margin-top:auto; }
  .cart { background:var(--card); border-radius:12px; padding:16px; }
  .cart-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee; gap:8px; }
  .cart-row input { width:70px; flex:none; min-width:0; }
  textarea { width:100%; min-height:90px; padding:10px; border:1px solid #cfd4dc; border-radius:8px; font:inherit; }
  footer { text-align:center; color:var(--muted); padding:30px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>VYAS ASSOCIATES</h1>
  <p>Wear parts for crushers, conveyors and screening equipment, made and tested in-house.</p>
</header>

<main>
  <h2>Product Catalogue</h2>
  <div class="toolbar">
    <input id="search" placeholder="Search parts (e.g. concave, roller)…">
    <select id="lineFilter"></select>
    <select id="equipFilter"></select>
  </div>
  <div id="products" class="grid"></div>

  <h2>Enquiry List</h2>
  <div class="cart">
    <div id="cartItems"></div>
    <p><textarea id="notes" placeholder="Customer name, machine model, drawing no., special requirements…"></textarea></p>
    <button onclick="submitEnquiry()">Generate Enquiry</button>
    <button class="secondary" onclick="clearCart()">Clear</button>
    <pre id="output" class="muted"></pre>
  </div>

  <h2>Our Facilities</h2>
  <div id="facilities" class="grid"></div>
</main>

<footer>Vyas Associates. Product and facility data is sample data; replace with real data.</footer>

<script>
// ---------- DATA (edit this to match your real catalogue) ----------
const products = [
  { id:1, name:"Concave",            equipment:"Cone Crusher",     material:"Manganese Steel (Mn14/Mn18/Mn22)", desc:"Fixed crushing liner for cone crushers." },
  { id:2, name:"Mantle",             equipment:"Cone Crusher",     material:"Manganese Steel (Mn14/Mn18/Mn22)", desc:"Moving crushing liner mounted on the main shaft." },
  { id:3, name:"Jaw Plate",          equipment:"Jaw Crusher",      material:"Manganese Steel / Chrome Alloy",   desc:"Fixed and swing jaw plates for primary crushing." },
  { id:4, name:"Cheek Plate",        equipment:"Jaw Crusher",      material:"Manganese Steel",                  desc:"Side liners protecting the crusher frame." },
  { id:5, name:"Wedges",             equipment:"Jaw Crusher",      material:"Alloy Steel",                      desc:"Locks jaw plates securely in position." },
  { id:6, name:"Roller",             equipment:"Roller Crusher",   material:"Alloy Steel / Mn Steel",           desc:"Crushing roller shells for roll crushers." },
  { id:7, name:"Idler Roller",       equipment:"Conveyor",         material:"Steel Tube with Sealed Bearings",  desc:"Carrying and return rollers for belt conveyors." },
  { id:8, name:"Wire Mesh",          equipment:"Vibrating Screen", material:"High Carbon / Stainless Steel",    desc:"Woven and crimped screening media." },
  { id:9, name:"Shaft Wear Ring",    equipment:"Shaft / Pump",     material:"Hardened Alloy Steel",             desc:"Replaceable ring protecting shafts from wear." }
];

const facilities = [
  { name:"NDT Facility", items:["Ultrasonic Testing (UT)","Magnetic Particle Inspection (MPI)","Dye Penetrant Testing (DPT)","Radiography"] },
  { name:"Machine Facility", items:["CNC Vertical Turning Lathes","Horizontal Machining Centres","Boring & Milling","Heavy Duty Lathes"] },
  { name:"Testing Facility", items:["Chemical Analysis (Spectro)","Hardness Testing","Tensile & Impact Testing","Microstructure Analysis"] }
];

// ---------- STATE ----------
let cart = {}; // { productId: qty }

// ---------- RENDER ----------
const $ = id => document.getElementById(id);

function setupFilters() {
  const equip = [...new Set(products.map(p => p.equipment))];
  $("lineFilter").innerHTML = `<option value="">All Product Lines</option>` +
    products.map(p => `<option>${p.name}</option>`).join("");
  $("equipFilter").innerHTML = `<option value="">All Equipment</option>` +
    equip.map(e => `<option>${e}</option>`).join("");
}

function renderProducts() {
  const q = $("search").value.toLowerCase();
  const line = $("lineFilter").value, eq = $("equipFilter").value;
  const list = products.filter(p =>
    (!line || p.name === line) &&
    (!eq || p.equipment === eq) &&
    (p.name + p.desc + p.material + p.equipment).toLowerCase().includes(q));
  $("products").innerHTML = list.length ? list.map(p => `
    <div class="card">
      <h3>${p.name}</h3>
      <div><span class="tag">${p.equipment}</span></div>
      <div class="muted">${p.desc}</div>
      <div class="muted"><b>Material:</b> ${p.material}</div>
      <button onclick="addToCart(${p.id})">Add to Enquiry</button>
    </div>`).join("") : `<p class="muted">No parts found.</p>`;
}

function renderCart() {
  const ids = Object.keys(cart);
  $("cartItems").innerHTML = ids.length ? ids.map(id => {
    const p = products.find(x => x.id == id);
    return `<div class="cart-row">
      <span>${p.name} <span class="muted">(${p.equipment})</span></span>
      <span><input type="number" min="1" value="${cart[id]}" onchange="setQty(${id}, this.value)">
      <button class="secondary" onclick="removeItem(${id})">✕</button></span>
    </div>`;
  }).join("") : `<p class="muted">No items yet. Add parts from the catalogue.</p>`;
}

function renderFacilities() {
  $("facilities").innerHTML = facilities.map(f => `
    <div class="card"><h3>${f.name}</h3>
      <ul>${f.items.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>`).join("");
}

// ---------- ACTIONS ----------
function addToCart(id) { cart[id] = (cart[id] || 0) + 1; renderCart(); }
function setQty(id, v) { cart[id] = Math.max(1, parseInt(v) || 1); }
function removeItem(id) { delete cart[id]; renderCart(); }
function clearCart() { cart = {}; $("output").textContent = ""; renderCart(); }

function submitEnquiry() {
  const ids = Object.keys(cart);
  if (!ids.length) { alert("Add at least one item."); return; }
  const lines = ids.map((id, i) => {
    const p = products.find(x => x.id == id);
    return `${i + 1}. ${p.name} (${p.equipment}) - Qty: ${cart[id]}`;
  });
  const text = `ENQUIRY - ${new Date().toLocaleDateString()}\n\n${lines.join("\n")}\n\nNotes: ${$("notes").value || "-"}`;
  $("output").textContent = text;
  // Demo only: send to a backend here, e.g. fetch("/api/enquiry", {method:"POST", body:JSON.stringify({cart, notes})})
  navigator.clipboard?.writeText(text);
}

["search", "lineFilter", "equipFilter"].forEach(id => $(id).addEventListener("input", renderProducts));

setupFilters(); renderProducts(); renderCart(); renderFacilities();
</script>
</body>
</html>
